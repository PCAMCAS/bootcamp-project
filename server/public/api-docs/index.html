<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskFlow API Docs</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
    />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
      }

      #swagger-ui {
        max-width: 1200px;
        margin: 0 auto;
      }

      .topbar {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>

    <script>
      function loadSwagger(url) {
        return SwaggerUIBundle({
          url: url,
          dom_id: '#swagger-ui',
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          layout: 'StandaloneLayout',
          deepLinking: true,
          docExpansion: 'none',
          tryItOutEnabled: true,
        });
      }

      window.onload = () => {
        // Intento principal (correcto en tu backend actual)
        fetch('/api-docs.json')
          .then(res => {
            if (!res.ok) throw new Error('No se pudo cargar swagger');
            return res.json();
          })
          .then(() => {
            loadSwagger('/api-docs.json');
          })
          .catch(() => {
            // Fallback útil si Vercel rompe rutas (muy típico)
            console.warn('Fallback Swagger activado');

            loadSwagger('http://localhost:3000/api-docs.json');
          });
      };
    </script>
  </body>
</html>
